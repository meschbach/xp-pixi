<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xp-pixi</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #101018;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .game-root {
        position: relative;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #e8ecf1;
      }
      .hud-root {
        position: absolute;
        inset: 0;
        pointer-events: none;
        user-select: none;
      }
      .hud-root .hidden {
        display: none !important;
      }
      .hud-stats {
        position: absolute;
        top: 10px;
        left: 14px;
        display: flex;
        gap: 20px;
        font-size: 18px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }
      .hud-money {
        color: #ffe066;
      }
      .hud-lives {
        color: #ff8787;
      }
      .hud-wave {
        color: #a5d8ff;
      }
      .hud-start {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        font: inherit;
        font-size: 16px;
        padding: 9px 26px;
        background: #2f9e44;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .hud-start:hover {
        background: #37b24d;
      }
      .hud-hint {
        position: absolute;
        bottom: 14px;
        left: 16px;
        font-size: 12px;
        opacity: 0.55;
      }
      .hud-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 8, 14, 0.72);
        pointer-events: auto;
      }
      .hud-panel {
        text-align: center;
      }
      .hud-panel h1 {
        font-size: 44px;
        margin: 0 0 8px;
      }
      .hud-panel p {
        margin: 0 0 20px;
        opacity: 0.85;
      }
      .hud-restart {
        font: inherit;
        font-size: 18px;
        padding: 10px 30px;
        background: #1971c2;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .hud-restart:hover {
        background: #1c7ed6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
